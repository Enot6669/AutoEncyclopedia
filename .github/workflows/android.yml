name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify offline content
        run: node tests/smoke.js
      - name: Build APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p build
          if [[ -n "$ANDROID_KEYSTORE_B64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > build/local-debug.p12
          fi
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash build.sh
          mkdir -p dist
          cp ../AutoEncyclopedia-*.apk dist/
      - uses: actions/upload-artifact@v4
        with:
          name: AutoEncyclopedia-APK
          path: dist/*.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoEncyclopedia-APK
          path: dist
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/*.apk --repo "$REPO" --title "AutoEncyclopedia $TAG" --notes "Test build. Without the configured signing key, installing over older builds is not supported." --prerelease
