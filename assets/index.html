<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АвтоЭнциклопедия</title>
<style>
:root{color-scheme:dark;--bg:#10191f;--panel:#1c2931;--muted:#9caeb8;--accent:#77dfac}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5f5;font:16px system-ui,sans-serif}header{padding:22px 18px 12px;background:linear-gradient(140deg,#25423f,#10191f)}header small{color:var(--accent);letter-spacing:2px}h1{font-size:26px;margin:8px 0}h2{font-size:20px}h3{font-size:16px;color:var(--accent)}p{line-height:1.6}main{padding:16px 16px 100px;max-width:780px;margin:auto}button,input,select,textarea{font:inherit;color:inherit;border:1px solid #3e535b;border-radius:13px;background:#1b2a32;padding:12px}button{cursor:pointer}button.active,.primary{background:var(--accent);color:#10271c;border-color:var(--accent);font-weight:700}input,select,textarea{width:100%;margin:5px 0 12px}label{color:var(--muted);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.card{width:100%;text-align:left;padding:16px;margin:8px 0;background:var(--panel);border:1px solid #34454e;border-radius:16px}.card strong{display:block;font-size:17px;margin-bottom:5px}.muted,small{color:var(--muted)}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.chips button{white-space:nowrap;padding:8px 12px;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#162128;border-top:1px solid #334650;padding:8px;gap:5px}nav button{flex:1;padding:10px 3px;font-size:12px;border:0}a{color:#9ae9c1;overflow-wrap:anywhere}.warning{border-left:3px solid #edb96b;padding:10px;background:#302b22;border-radius:6px;color:#ffe2b7}svg{width:100%;height:auto;background:#142127;border-radius:14px}li{margin:8px 0;line-height:1.45}.badge{font-size:12px;color:var(--accent)}.empty{padding:24px;color:var(--muted)}
</style></head><body><header><small>ГАРАЖ • OFFLINE • v0.4</small><h1>АвтоЭнциклопедия</h1><div id="subtitle" class="muted">Справочник владельца</div></header><main id="main"></main><nav id="nav"></nav><script src="data.js"></script><script src="fuel.js"></script><script src="technical.js"></script><script src="photo-data.js"></script><script src="visuals.js"></script><script src="technical-ui.js"></script><script src="atlas.js"></script><script src="workshop.js"></script><script>
const $=id=>document.getElementById(id), read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let car=read('car','niva'), model=read('model','21214'), tab='catalog', category='Все', query='', detail=null;
const models={niva:['2121 (карбюратор)','21213 (карбюратор)','21214 (инжектор)','2131','Niva Legend'],datsun:['11183 • 8 клапанов','11186 • 8 клапанов','21127 • 16 клапанов']};
const names={niva:'ВАЗ-2121 / Нива',datsun:'Datsun on-DO'};
function changeCar(v){car=v;model=models[v][0];save('car',car);save('model',model);category='Все';query='';render()}
function changeModel(v){model=v;save('model',v);render()}
function activeCards(){return DATA.filter(x=>x.car==='both'||x.car===car).filter(x=>!x.injection||!model.includes('карбюратор')).filter(x=>x.id!=='niva-carb'||model.includes('карбюратор')||model==='2131').filter(x=>x.mode!=='carb'||model.includes('карбюратор')||model==='2131')}
function goto(v){tab=v;detail=null;render();window.scrollTo(0,0)}
function backApp(){const d=document.querySelector('dialog[open]');if(d){d.close();return}if(detail){detail=null;render()}else goto('catalog')}
function render(){ $('subtitle').textContent=names[car]+' · '+model; $('nav').innerHTML=[['catalog','▤ Каталог'],['map','◎ Где искать'],['fav','★ Избранное'],['garage','▦ Гараж']].map(([v,n])=>'<button class="'+(tab===v?'active':'')+'" onclick="goto(\''+v+'\')">'+n+'</button>').join('');if(detail){showDetail(detail);return} if(tab==='garage'){garage();return} if(tab==='map'){mapPage();return}if(tab==='fav'){let f=read('fav',[]);$('main').innerHTML='<h2>Избранные статьи</h2>'+list(DATA.filter(x=>f.includes(x.id)));return}let cats=['Все','Топливная система',...new Set(activeCards().map(x=>x.cat).filter(c=>c!=='Топливная система'))];$('main').innerHTML='<div class="row"><button class="'+(car==='niva'?'active':'')+'" onclick="changeCar(\'niva\')">Нива</button><button class="'+(car==='datsun'?'active':'')+'" onclick="changeCar(\'datsun\')">Datsun on-DO</button></div><label>Модификация (выберите по документам)</label><select id="model" onchange="changeModel(this.value)">'+models[car].map(m=>'<option '+(m===model?'selected':'')+'>'+esc(m)+'</option>').join('')+'</select><button class="card" onclick="category=\'Топливная система\';query=\'\';render()"><strong>⛽ Топливная система</strong><small>Магистрали, трубки, бензонасос, проводка</small></button><input id="q" placeholder="Название, симптом, код ошибки…" value="'+esc(query)+'" oninput="query=this.value;results()"><div class="chips">'+cats.map(c=>'<button class="'+(category===c?'active':'')+'" onclick="category=\''+c+'\';render()">'+c+'</button>').join('')+'</div><div id="results"></div><p class="muted">Версия 0.4 • офлайн-справочник. Уточняйте комплектацию и заводские данные перед ремонтом.</p>';results()}
function results(){let q=query.trim().toLowerCase();let a=activeCards().filter(x=>(category==='Все'||category===x.cat)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('results').innerHTML='<p class="badge">Найдено: '+a.length+'</p>'+list(a)}
function list(a){return a.length?a.map(x=>'<button class="card" onclick="openCard(\''+x.id+'\')"><strong>'+esc(x.title)+'</strong><small>'+esc(x.cat)+' · '+esc(x.zone)+'</small><p>'+esc(x.sym)+'</p></button>').join(''):'<div class="empty">Нет подходящих статей.</div>'}
function openCard(id){detail=id;render();window.scrollTo(0,0)}
const zones={'Моторный отсек':[150,53],'Салон':[150,110],'Под кузовом':[150,155],'Колёса':[95,152],'Задняя часть':[150,224]};
function diagram(zone){let p=zones[zone]||zones['Моторный отсек'];return '<svg viewBox="0 0 300 290" aria-label="Условная схема зон автомобиля"><rect x="91" y="20" width="118" height="246" rx="40" fill="#293d44" stroke="#a5b7bf" stroke-width="2"/><rect x="102" y="31" width="96" height="60" rx="10" fill="#406052"/><path d="M105 100 L195 100 L190 132 L110 132Z" fill="#60808b"/><rect x="107" y="136" width="86" height="67" rx="10" fill="#35525c"/><rect x="105" y="213" width="90" height="40" rx="8" fill="#406052"/>'+[55,202].map(y=>'<rect x="76" y="'+y+'" width="18" height="40" rx="5" fill="#0c1318"/><rect x="206" y="'+y+'" width="18" height="40" rx="5" fill="#0c1318"/>').join('')+'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="18" fill="#77dfac" fill-opacity=".35" stroke="#77dfac" stroke-width="3"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#77dfac"/><text x="150" y="15" fill="#cde2dd" text-anchor="middle" font-size="10">ПЕРЕД</text><text x="150" y="282" fill="#cde2dd" text-anchor="middle" font-size="10">ЗАД</text></svg><small>Условная карта зоны, не монтажный чертёж и не фотография.</small>'}
function showDetail(id){let x=DATA.find(x=>x.id===id);if(!x){goto('catalog');return}let f=read('fav',[]);$('main').innerHTML='<button onclick="backApp()">← Назад</button><h2>'+esc(x.title)+'</h2><div class="badge">'+esc(x.cat)+' • '+esc(x.car==='both'?'Оба автомобиля':names[x.car])+' • OFFLINE</div><p>'+esc(x.desc)+'</p><h3>Внешний вид детали</h3>'+articlePhoto(x)+diagram(x.zone)+'<h3>Где находится / как найти</h3><p>'+esc(x.loc)+'</p>'+(x.fuel?(x.id==='fuel-wires'?wiringDiagram():fuelDiagram(x)):'')+'<h3>Симптомы</h3><p>'+esc(x.sym)+'</p><h3>Что проверить</h3><ol>'+x.check.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><h3>Ремонт и обслуживание</h3><p>'+esc(x.fix)+'</p><p class="warning">'+esc(x.warn||'Работайте на остывшем автомобиле, проверяйте точные требования для своей модификации.')+'</p><button class="primary" onclick="toggleFav(\''+id+'\')">'+(f.includes(id)?'★ Убрать из избранного':'☆ В избранное')+'</button><details><summary>Источники и дополнительные материалы (необязательно, интернет)</summary>'+sources(x)+'</details>'}
function sources(x){let c=x.car==='both'?car:x.car;let links=x.fuel?[...SOURCES[c],...FUEL_SOURCES[c]]:SOURCES[c];return links.map(([t,u])=>'<p><a href="'+u+'">'+esc(t)+'</a></p>').join('')}
function toggleFav(id){let f=read('fav',[]);f=f.includes(id)?f.filter(v=>v!==id):[...f,id];save('fav',f);showDetail(id)}
function photo(){return car==='niva'?'<div class="card"><img src="photos/niva-engine.jpg" style="width:100%;border-radius:9px" alt="Моторный отсек Нивы 1991"><small>Нива 1991 г., карбюраторная версия. Фото: <a href="https://commons.wikimedia.org/wiki/File:1991_Lada_Niva_running_engine_(4974120617).jpg">dave_7</a>, <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a>. У других версий компоновка отличается.</small></div>':'<div class="card"><img src="photos/datsun.jpg" style="width:100%;border-radius:9px" alt="Datsun on-DO"><small>Datsun on-DO 2014. Фото: <a href="https://commons.wikimedia.org/wiki/File:Datsun_on-DO.JPG">Milhouse35</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</small></div>'}
function mapPage(){$('main').innerHTML='<h2>Где искать</h2><button class="card" onclick="showGallery()"><strong>Фотогалерея деталей • офлайн</strong><small>'+Object.keys(PHOTOS).length+' изображений, доступных без сети</small></button><button class="card" onclick="openCard(\''+(car==='datsun'?'fuel-datsun-map':model.includes('карбюратор')?'fuel-carb-map':'fuel-niva-map')+'\')"><strong>Топливная система</strong><small>Трубки, подача, обратка, вентиляция и жгуты</small></button>'+photo()+'<p class="muted">Выберите область автомобиля</p>'+diagram('Моторный отсек')+Object.keys(zones).map(z=>'<button class="card" onclick="showZone(\''+z+'\')"><strong>'+z+'</strong><small>'+activeCards().filter(x=>x.zone===z).length+' статей</small></button>').join('')}
function showGallery(){$('main').innerHTML='<button onclick="mapPage()">← Назад</button>'+gallery();window.scrollTo(0,0)}
function showZone(z){$('main').innerHTML='<button onclick="mapPage()">← Все зоны</button><h2>'+z+'</h2>'+diagram(z)+list(activeCards().filter(x=>x.zone===z))}
function garage(){let k='garage_'+car,g=read(k,{mileage:'',entries:[]});$('main').innerHTML='<h2>Мой гараж</h2><p>'+esc(names[car])+'</p><label>Пробег, км</label><input id="km" type="number" min="0" value="'+esc(g.mileage)+'"><button onclick="saveMileage()">Сохранить пробег</button><h2>Журнал обслуживания</h2><label>Дата</label><input type="date" id="date" value="'+new Date().toISOString().slice(0,10)+'"><label>Что сделали</label><textarea id="note" placeholder="Работа, запчасти…"></textarea><label>Стоимость, ₽</label><input id="cost" type="number" min="0"><button class="primary" onclick="addEntry()">Добавить запись</button><p>Всего расходов: '+g.entries.reduce((s,e)=>s+e.cost,0).toLocaleString('ru-RU')+' ₽</p>'+g.entries.map(e=>'<div class="card"><strong>'+esc(e.note)+'</strong><small>'+esc(e.date)+' · '+esc(e.km)+' км · '+e.cost+' ₽</small></div>').join('')}
function saveMileage(){let k='garage_'+car,g=read(k,{entries:[]});g.mileage=$('km').value;save(k,g);garage()}
function addEntry(){let note=$('note').value.trim(),cost=Number($('cost').value||0),km=$('km').value;if(!note||cost<0||!Number.isFinite(cost)||Number(km)<0)return;let k='garage_'+car,g=read(k,{entries:[]});g.mileage=km;g.entries.unshift({note,cost,km,date:$('date').value});save(k,g);garage()}
if(!models[car])car='niva';if(!models[car].includes(model))model=models[car][0];activateTechnicalUI();installWorkshopUI();activateAtlas();render();
</script></body></html>
